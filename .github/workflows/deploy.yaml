name: CI/CD Pipeline

on:
  push:

    branches: [ "main", "develop", "feature/coursework_1" ]
  pull_request:
    branches: [ "main", "develop", "feature/coursework_1" ]

jobs:


  build_and_deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Yandex Cloud Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo mkdir -p /app
          sudo chown -R $USER:$USER /app
          cd /app
          
      
          if [ ! -d "habit-tracker" ]; then
            git clone -b feature/coursework_1 https://github.com{{ github.repository }}.git habit-tracker
            cd habit-tracker
          else
            cd habit-tracker
            git fetch --all
            git reset --hard origin/feature/coursework_1
          fi
          
          
          cat << 'EOF' > .env
          SECRET_KEY=django-insecure-production-cloud-key-99999
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.SERVER_HOST }},localhost,127.0.0.1,web,db
          DATABASE_URL=postgres://postgres:postgres@db:5432/habit_tracker
          POSTGRES_DB=habit_tracker
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD:postgres
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          CORS_ALLOWED_ORIGINS=http://${{ secrets.SERVER_HOST }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          EOF
          
          docker compose down
          docker compose up -d --build

