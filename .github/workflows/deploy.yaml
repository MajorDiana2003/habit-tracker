name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/coursework_1" ]
  pull_request:
    branches: [ "main", "develop", "feature/coursework_1" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: habit_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/habit_tracker_test
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        SECRET_KEY: django-insecure-test-key-for-github-actions
        TELEGRAM_BOT_TOKEN: mock_token
      run: |
        python manage.py test

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Yandex Cloud Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo mkdir -p /app
          sudo chown -R $USER:$USER /app
          cd /app

          if [ ! -d "habit-tracker" ]; then
            git clone -b feature/coursework_1 https://github.com{{ github.repository }}.git habit-tracker
            cd habit-tracker
          else
            cd habit-tracker
            git fetch --all
            git reset --hard origin/feature/coursework_1
          fi
          
          
          cat << 'EOF' > .env
          SECRET_KEY=django-insecure-production-cloud-key-99999
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.SERVER_HOST }},localhost,127.0.0.1,web,db
          DATABASE_URL=postgres://postgres:postgres@db:5432/habit_tracker
          POSTGRES_DB=habit_tracker
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          CORS_ALLOWED_ORIGINS=http://${{ secrets.SERVER_HOST }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          EOF
          
          docker compose down
          docker compose up -d --build
